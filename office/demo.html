<title>AI Agency Office 3D</title>
<section id="agency-sim" aria-label="ออฟฟิศ AI จำลอง">
<style>
#agency-sim{color-scheme:light dark;--paper:light-dark(#faf9ff,#201c2c);--tile:light-dark(#fff,#2a2538);--ink:light-dark(#21182f,#f4ecfc);--line:light-dark(#ded6e8,#494052);font:15px/1.45 system-ui;background:var(--paper);color:var(--ink);border-radius:18px;padding:18px}
#agency-sim h2,#agency-sim h3,#agency-sim p{margin:0}
#agency-sim header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
#agency-sim .layout{display:grid;grid-template-columns:1.65fr 1fr;gap:14px}
#agency-sim .rooms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:8px 0 14px}
#agency-sim button,#agency-sim input{font:inherit;color:inherit;border:1px solid var(--line);border-radius:10px;background:var(--tile);padding:8px;min-height:42px}
#agency-sim .room{text-align:left;overflow-wrap:anywhere;display:grid;gap:4px}
#agency-sim .room[aria-pressed=true]{outline:2px solid light-dark(#694bc8,#b5a1ff)}
#agency-sim .portrait{display:grid;place-items:center;font-size:32px;background:var(--tone);border-radius:7px;min-height:55px}
#agency-sim .back .portrait{min-height:40px;font-size:25px}
#agency-sim small{display:block}
#agency-sim aside{display:grid;gap:10px;align-content:start;min-width:0}
#agency-sim article{background:var(--tile);border:1px solid var(--line);border-radius:12px;padding:12px;overflow-wrap:anywhere}
#agency-sim article h3{margin-bottom:8px}
#agency-sim #sim-tasks p,#agency-sim #sim-chat p{margin:6px 0}
#agency-sim form{display:flex;gap:6px;margin-top:10px}
#agency-sim input{min-width:0;flex:1}
@media(max-width:620px){#agency-sim .layout{grid-template-columns:1fr}}
#agency-sim .rooms{gap:12px}
#agency-sim .room{padding:0;border-radius:13px;overflow:hidden;gap:0;background:light-dark(#232634,#272a3a);color:#fff}

#office-3d{background:linear-gradient(140deg,#e0e7ff,#fceaf6);border:1px solid #d7deea;border-radius:15px;margin-bottom:14px;color:#202437;overflow:hidden}
#office-3d-stage{height:clamp(300px,42vw,490px);position:relative}
#office-3d-stage[hidden],.office-3d-controls button[hidden]{display:none}
#office-3d-stage canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.office-3d-controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:8px 10px;background:#f9f7ff}
.office-3d-controls small{flex:1;color:#394158}
.office-3d-controls button{min-height:34px;background:#fff;color:#202437;border:1px solid #d0d7ea;border-radius:7px;padding:4px 9px;font:inherit}

#office-3d-stage{height:clamp(330px,48vw,575px);background:radial-gradient(ellipse at 50% 42%,#fbfcff,#e4e9f6)}
.office-avatar-caption{position:absolute;z-index:1;transform:translate(-50%,-100%);pointer-events:none;max-width:clamp(100px,27%,185px);padding:4px 7px;border:1px solid #d7deed;border-radius:8px;color:#18223a;background:#fffffff5;text-align:center;box-shadow:0 2px 9px #1a274323;line-height:1.2}
.office-avatar-caption strong,.office-avatar-caption small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.office-avatar-caption strong{font-size:clamp(10px,1.1vw,13px)}
.office-avatar-caption small{font-size:clamp(10px,1vw,12px);margin-top:2px;color:#494c70}
#agency-sim .rooms{gap:16px}
#agency-sim .room{position:relative}
#agency-sim .room .card-activity{position:absolute;inset:7px auto auto 7px;max-width:calc(100% - 14px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#172032ec;color:#fff;border-radius:6px;padding:4px 7px;font-size:12px}

html{background:#080d1b;color-scheme:dark}
body{margin:0;background:#080d1b;color:#edf3ff}
#agency-sim{--paper:#080d1b;--tile:#141e32;--ink:#edf3ff;--line:#394664;background:#080d1b;color:#edf3ff}
#agency-sim article,#agency-sim button,#agency-sim input{color:#edf3ff}
#agency-sim .room{background:#151d32}
#office-3d{background:#0d1528;border-color:#34486e;color:#edf3ff}
#office-3d-stage{background:radial-gradient(ellipse at 50% 42%,#1e2b4d,#0b1021)}
.office-3d-controls{background:#111b31}
.office-3d-controls small{color:#d1dfff}
.office-3d-controls button{background:#202e4b;color:#edf3ff;border-color:#405278}
.office-avatar-caption{background:#141f38f5;color:#f1f6ff;border-color:#425987}
.office-avatar-caption small{color:#bcdbff}
#agency-sim .card-activity::before{content:"";display:inline-block;width:6px;height:6px;margin-right:6px;border-radius:50%;background:#81bfff;animation:office-indicator 2s ease-in-out infinite}
@keyframes office-indicator{50%{opacity:.45}}
@media(prefers-reduced-motion:reduce){#agency-sim .card-activity::before{animation:none}}

#agency-sim .layout{grid-template-columns:minmax(0,3fr) minmax(245px,1fr)}
@media(max-width:800px){#agency-sim .layout{grid-template-columns:minmax(0,1fr)}}
#office-3d-stage{height:clamp(380px,48vw,710px);background:#8bc6ef}
#office-3d-stage[hidden],.office-3d-controls button[hidden]{display:none}
#office-3d-stage canvas{position:relative}
.office-column{min-width:0}
.office-avatar-caption{box-shadow:0 0 12px #5ca4f02f}

<script>
(() => {
  const root = document.getElementById('agency-sim');
  const get = id => root.querySelector('#' + id);
  const team = [
    ['Sales & Account Executive','🎧','#e0efb9','#3b4824','เสร็จแล้ว','รับบรีฟโพสต์ลอยกระทง','รับบรีฟและส่งโจทย์ให้ Content Planner แล้วค่ะ'],
    ['Content Planner','💡','#f9d9e9','#573449','กำลังทำงาน','คิดคอนเซปต์โพสต์ลอยกระทง','กำลังทำบรีฟแนว “กดส่งคำขอพร” ค่ะ'],
    ['Graphic Designer','🎨','#d2f0e0','#26483a','รอทำงาน','ทำภาพจากบรีฟ','รอคอนเซปต์จาก Content Planner ค่ะ'],
    ['Video Editor','🎬','#e7dcfa','#443557','ยังไม่มีงาน','',''],
    ['SEO Specialist','🔎','#cfeef4','#2b4850','ยังไม่มีงาน','',''],
    ['Web Developer','💻','#d9e4fb','#2f3e62','ยังไม่มีงาน','','']
  ];
  const notes = team.map(() => []);
  let selected = 1;
  let step = 0;
  const buttons = team.map(([name], index) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'room';
    const portrait = document.createElement('span');
    portrait.className = 'portrait';
    portrait.setAttribute('aria-hidden', 'true');
    const column = index % 2 === 0 ? '0%' : '100%';
    const row = ['0%', '50%', '100%'][Math.floor(index / 2)];
    button.style.setProperty('--portrait-position', column + ' ' + row);
    const title = document.createElement('strong');
    title.textContent = name;
    const activity = document.createElement('span');
    activity.className='card-activity';
    activity.setAttribute('aria-hidden','true');
    button.append(portrait, title, document.createElement('small'), activity);
    button.onclick = () => { selected = index; render(); };
    get(index < 4 ? 'sim-main' : 'sim-back').append(button);
    return button;
  });
  function add(parent, value) {
    const p = document.createElement('p');
    p.textContent = value;
    parent.append(p);
  }
  const stage = get('office-3d-stage');
  stage.addEventListener('office-room', event => { selected = event.detail; render(); });
  function render() {
    stage.dataset.selected = selected;
    stage.dataset.roles = JSON.stringify(team.map(role=>({name:role[0],status:role[4],activity:role[4]==='กำลังทำงาน'?role[5]:''})));
    const tasks = get('sim-tasks');
    const chat = get('sim-chat');
    tasks.replaceChildren();
    chat.replaceChildren();
    team.forEach((role, index) => {
      buttons[index].setAttribute('aria-pressed', String(index === selected));
      buttons[index].querySelector('small').textContent = role[4];
      buttons[index].dataset.state = role[4];
      buttons[index].querySelector('.card-activity').textContent = role[4]==='กำลังทำงาน'?role[5]:role[4];
      if (role[5]) add(tasks, role[5] + ' · ' + role[4]);
    });
    get('sim-chat-title').textContent = 'Chat · ' + team[selected][0];
    add(chat, team[selected][6] || 'ยังไม่มีข้อความตัวอย่าง');
    notes[selected].forEach(note => add(chat, 'คุณ (ทดลอง) · ' + note));
    get('sim-next').disabled = step === 2;
  }
  get('sim-next').onclick = () => {
    if (step === 0) {
      team[1][4] = 'เสร็จแล้ว';
      team[1][6] = 'ส่งบรีฟให้ Graphic Designer แล้วค่ะ';
      team[2][4] = 'กำลังทำงาน';
      team[2][6] = 'รับบรีฟแล้ว กำลังขึ้นภาพค่ะ';
      stage.dispatchEvent(new CustomEvent('office-handoff', {detail:{
        from:1,to:2,label:'ส่งบรีฟถึง Graphic Designer · จำลอง'
      }}));
    } else if (step === 1) {
      team[2][4] = 'เสร็จแล้ว';
      team[2][6] = 'ภาพตัวอย่างพร้อมให้ตรวจค่ะ';
    }
    step += 1;
    selected = 2;
    render();
  };
  root.querySelector('form').onsubmit = event => {
    event.preventDefault();
    const input = event.currentTarget.querySelector('input');
    const value = input.value.trim();
    if (!value) return;
    notes[selected].push(value);
    input.value = '';
    render();
  };
  render();
})();
</script>
<script type="module">
const view = document.getElementById('office-3d-stage');
const notice = document.getElementById('office-3d-notice');
try {
  const T = await import('https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js');
  let renderer;
  try {
    renderer = new T.WebGLRenderer({antialias:true, alpha:true});
  } catch {
    const {createSoftwareRenderer} = await import('./software-renderer.mjs');
    renderer = createSoftwareRenderer(T);
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputColorSpace = T.SRGBColorSpace;
  view.append(renderer.domElement);
  const scene = new T.Scene();
  scene.background = new T.Color(0x8bc6ef);
  scene.fog = new T.FogExp2(0xcbe4f4,.018);
  scene.add(new T.HemisphereLight(0xe6f6ff, 0x9c9eaf, 1.85));
  const lamp = new T.DirectionalLight(0xfff2df, 2.55);
  lamp.position.set(-7, 12, 5);
  scene.add(lamp);
  const camera = new T.PerspectiveCamera(38, 1, .1, 110);
  const colors = [0xa1d52c,0xf84599,0x21ceb3,0x8950ed,0x23b8dc,0x3672ee];
  const hair = [0xffbe56,0xab1458,0xef581e,0x4c22bc,0xe8e9ff,0x20294b];
  const group = new T.Group();
  scene.add(group);
  const hit = [];
  const hoverTargets = [];
  let hovered = -1;
  const roomEdges = [];
  const avatars = [];
  const captions = [];
  const headPosition = new T.Vector3();
  const sizes = {width:0,height:0};
  const bounds = {left:-7.7,right:7.7,back:-5.52,front:7.15};
  const floorY=.091;
  const {left,right,back,front}=bounds;
  const width=right-left;
  const depth=front-back;
  const centerZ=(front+back)/2;
  const floor = new T.Mesh(new T.BoxGeometry(width,.09,depth),new T.MeshStandardMaterial({color:0x364557,roughness:.48,metalness:.22}));
  floor.position.set(0,floorY-.045,centerZ);
  group.add(floor);
  const site = new T.Mesh(new T.PlaneGeometry(92,88),new T.MeshStandardMaterial({color:0x758593,roughness:1}));
  site.rotation.x=-Math.PI/2;
  site.position.set(0,floorY-.095,centerZ);
  group.add(site);
  const geometry = {
    box:new T.BoxGeometry(1,1,1),
    ball:new T.SphereGeometry(.5,24,16),
    capsule:new T.CapsuleGeometry(.25,.5,8,16),
  };
  function part(room, shape, color, size, xyz) {
    const object = new T.Mesh(geometry[shape],new T.MeshStandardMaterial({color,roughness:.62}));
    object.scale.set(...size);
    object.position.set(...xyz);
    object.userData.room = room.userData.room;
    room.add(object);
    hit.push(object);
    return object;
  }
  colors.forEach((color, i) => {
    const room = new T.Group();
    room.userData.room = i;
    room.position.set(i%2 ? 4.12 : -4.12, 0, (Math.floor(i/2)-1)*3.67);
    group.add(room);
    const rug = part(room,'box',color,[3.5,.008,2.05],[0,floorY+.004,.08]);
    rug.material.color.lerp(new T.Color(0x463949),.57);
    part(room,'box',0xd9dfe8,[2.2,.08,.78],[.54,.75,.55]);
    part(room,'box',0x293858,[.12,.59,.55],[-.43,.38,.55]);
    part(room,'box',0x293858,[.12,.59,.55],[1.51,.38,.55]);
    part(room,'box',0xcfd8ea,[.71,.43,.055],[-.47,1.075,1.035]);
    part(room,'box',0x11162d,[.66,.36,.016],[-.47,1.10,1.001]);
    const display=part(room,'box',color,[.59,.29,.012],[-.47,1.10,.990]);
    display.material.emissive.setHex(color);
    display.material.emissiveIntensity=.27;
    const interfacePane=part(room,'box',0x438ada,[.55,.38,.014],[.38,1.12,.88]);
    interfacePane.rotation.y=-.23;
    interfacePane.material.transparent=true;
    interfacePane.material.opacity=.45;
    interfacePane.material.depthWrite=false;
    for(let line=0;line<3;line++){
      const scan=part(room,'box',0x79e7ff,[.32-line*.05,.016,.016],[.35,1.19-line*.067,.89]);
      scan.rotation.y=-.23;
      scan.material.emissive.setHex(0x279fd7);
      scan.material.emissiveIntensity=.65;
    }
    const accent=part(room,'box',0x8a302f,[.28,.08,.55],[1.39,.778,.55]);
    accent.material.metalness=.48;
    part(room,'box',0xb7c6df,[.09,.18,.085],[-.47,.865,1.07]);
    part(room,'box',0xcfd8ea,[.30,.022,.18],[-.47,.805,1.04]);
    const deskProps = [
      [0xd8dfe9,.42,.05,.30], [0xf6d167,.37,.05,.28],
      [0x505972,.60,.064,.36], [0x7360b3,.52,.07,.34],
      [0x47b4c3,.32,.09,.26], [0x526bbe,.48,.07,.29]
    ];
    const [propColor,propWidth,propHeight,propDepth] = deskProps[i];
    part(room,'box',propColor,[propWidth,propHeight,propDepth],[.22,.81,.6]);
    part(room,'box',0xe4e9ef,[1.16,.07,.54],[-.47,.755,.88]);
    const deskLight=part(room,'box',color,[1.14,.016,.025],[-.47,.715,.63]);
    deskLight.material.emissive.setHex(color);
    deskLight.material.emissiveIntensity=.5;
    part(room,'box',0x1b2941,[.26,.012,.16],[-.16,.799,.88]);
    part(room,'box',0x17243b,[.60,.035,.22],[-.47,.81,.81]);
    for (let key=0;key<7;key++) part(room,'box',0x76a9dc,[.057,.012,.047],[-.72+key*.081,.833,.81]);
    part(room,'box',0x272e49,[.65,.12,.57],[-.47,.47,-.39]);
    part(room,'box',0x333f63,[.66,.56,.095],[-.47,.72,-.66]);
    part(room,'box',0x252e49,[.1,.4,.1],[-.47,.23,-.39]);
    const firstAvatarPart = room.children.length;
    const skin = i===1 ? 0xd89470 : 0xffbd91;
    const outfit = [
      {body:0xf39133,sleeve:0xfff5e5,trim:0xffbe60},
      {body:0xf7eef8,sleeve:0xf7eef8,trim:0xee3894},
      {body:0x236e55,sleeve:0x236e55,trim:0x9ce3a7},
      {body:0x8052c7,sleeve:0x8052c7,trim:0xcaacff},
      {body:0x54bdd6,sleeve:0x54bdd6,trim:0xc5f6fe},
      {body:0x6650ae,sleeve:0x6650ae,trim:0xb58cfb}
    ][i];
    part(room,'capsule',outfit.body,[1.13,.7,.93],[-.47,.87,-.12]);
    part(room,'box',outfit.trim,[.28,.11,.048],[-.47,.79,.109]);
    if (i===0) {
      for (const x of [-.63,-.31]) {
        part(room,'box',0xf39133,[.095,.30,.04],[x,1.01,.094]);
        part(room,'ball',0xffe3a6,[.052,.052,.033],[x,.91,.131]);
      }
    } else {
      for (const x of [-.55,-.39]) part(room,'box',outfit.trim,[.022,.18,.035],[x,1.03,.104]);
      part(room,'ball',outfit.body,[.55,.29,.24],[-.47,1.12,-.23]);
    }
    part(room,'ball',skin,[.89,.93,.84],[-.47,1.48,-.09]);
    part(room,'ball',hair[i],[.96,.52,.89],[-.47,1.79,-.13]);
    part(room,'ball',hair[i],[.38,.47,.43],[-.82,1.64,.07]).rotation.z=-.28;
    part(room,'ball',hair[i],[.32,.38,.36],[-.19,1.72,.13]);
    const iris=[0x745033,0x5c294f,0x315c38,0x6349a9,0x2a758c,0x303f7e][i];
    for (const [eye,x] of [-.63,-.32].entries()) {
      part(room,'ball',0xfff7ef,[.143,.154,.044],[x,1.505,.278]);
      part(room,'ball',iris,[.093,.115,.042],[x+.016,1.50,.307]);
      part(room,'ball',0x211a2d,[.051,.080,.025],[x+.021,1.50,.324]);
      part(room,'ball',0xffffff,[.023,.023,.018],[x+.008,1.53,.339]);
      const brow=part(room,'ball',hair[i],[.13,.027,.03],[x,1.621+((i+eye)%2)*.018,.286]);
      brow.rotation.z=eye ? -.14 : .14;
    }
    part(room,'ball',skin,[.096,.075,.064],[-.47,1.442,.325]);
    const smileCurve=new T.QuadraticBezierCurve3(
      new T.Vector3(-.585,1.375,.306),
      new T.Vector3(-.47,1.265,.336),
      new T.Vector3(-.355,1.375,.306)
    );
    const smile=new T.Mesh(new T.TubeGeometry(smileCurve,16,.017,8),new T.MeshStandardMaterial({color:0x9c3d57}));
    smile.userData.room=i;
    room.add(smile);
    hit.push(smile);
    for (const x of [-.73,-.21]) part(room,'ball',0xf49795,[.10,.044,.022],[x,1.41,.248]);
    if (i===0 || i===4) {
      for (const x of [-.63,-.32]) {
        const frame=new T.Mesh(new T.TorusGeometry(.113,.018,8,24),new T.MeshStandardMaterial({color:i===0?0xe98623:0x36b9d4}));
        frame.position.set(x,1.51,.328);
        frame.userData.room=i;
        room.add(frame);
        hit.push(frame);
      }
      part(room,'box',i===0?0xe98623:0x36b9d4,[.095,.028,.025],[-.47,1.51,.339]);
    }
    const limb = (color,width) => part(room,'capsule',color,[width,1,width],[0,0,0]);
    const upperArms = [limb(outfit.sleeve,.39),limb(outfit.sleeve,.39)];
    const forearms = [limb(skin,.28),limb(skin,.28)];
    const hands = [-.24,.24].map(x=>part(room,'ball',skin,[.15,.096,.16],[-.47+x,.88,.70]));
    if (i===0) part(room,'ball',hair[i],[.43,.40,.44],[-.50,2.01,-.2]);
    if (i===1) {
      part(room,'ball',0xff8ebd,[.29,.16,.12],[-.63,1.88,.17]);
      part(room,'ball',0xff8ebd,[.29,.16,.12],[-.32,1.88,.17]);
    }
    if (i===2 || i===5) part(room,'ball',i===2?0x20634c:0x6150a4,[.94,.41,.85],[-.49,1.86,-.16]);
    if (i===3) part(room,'ball',hair[i],[.38,.71,.40],[-.11,1.55,-.35]);
    if (i===0 || i===3) {
      for (const x of [-.91,-.03]) part(room,'ball',0x444058,[.22,.34,.29],[x,1.53,-.035]);
    }
    if (i===4) {
      const lens = new T.Mesh(new T.TorusGeometry(.19,.028,8,24),new T.MeshStandardMaterial({color:0x163854}));
      lens.position.set(-.74,1.37,.42);
      lens.userData.room=i;
      room.add(lens);
      hit.push(lens);
    }
    const legs = [limb(0x343a58,.47),limb(0x343a58,.47)];
    const shins = [limb(0x343a58,.40),limb(0x343a58,.40)];
    const shoes = [-.16,.16].map(x=>part(room,'box',0x22273a,[.20,.11,.31],[-.47+x,.14,.34]));
    const pieces = room.children.slice(firstAvatarPart);
    const avatar = new T.Group();
    avatar.position.set(-.47,0,-.10);
    room.add(avatar);
    for (const mesh of pieces) {
      mesh.position.sub(avatar.position);
      avatar.add(mesh);
    }
    avatars.push({avatar,legs,shins,shoes,upperArms,forearms,hands,room,home:avatar.position.clone(),inTransit:false,stand:0});
    const hoverTarget = new T.Mesh(
      new T.BoxGeometry(1.02,1.64,.85),
      new T.MeshBasicMaterial({visible:false})
    );
    hoverTarget.position.set(-.47,1.47,-.10);
    hoverTarget.userData.room=i;
    room.add(hoverTarget);
    hoverTargets.push(hoverTarget);
    const caption = document.createElement('span');
    caption.className = 'office-avatar-caption';
    caption.setAttribute('aria-hidden','true');

    const edge = new T.LineSegments(new T.EdgesGeometry(new T.BoxGeometry(3.53,.008,2.08)),new T.LineBasicMaterial({color:0xffffff}));
    edge.position.set(0,floorY+.013,.08);
    room.add(edge);
    roomEdges.push(edge);
  });
  const shell = new T.Group();
  group.add(shell);
  const wallMaterial = new T.MeshStandardMaterial({color:0x3e5267,roughness:.53,metalness:.15});
  const revealMaterial = new T.MeshStandardMaterial({color:0x9dbac8,roughness:.43});
  function shellBox(size, xyz, material=wallMaterial) {
    const mesh=new T.Mesh(new T.BoxGeometry(...size),material);
    mesh.position.set(...xyz);
    shell.add(mesh);
  }
  const tall=2.38;
  const low=.44;
  const thickness=.16;
  // Reference cutaway: tall left and back; low front and right.
  shellBox([thickness,tall,depth],[left+thickness/2,floorY+tall/2,centerZ]);
  shellBox([thickness,low,depth],[right-thickness/2,floorY+low/2,centerZ]);
  shellBox([width,low,thickness],[0,floorY+low/2,front-thickness/2]);
  shellBox([width,.04,.19],[0,floorY+low+.02,front-thickness/2],revealMaterial);
  shellBox([.19,.04,depth],[right-thickness/2,floorY+low+.02,centerZ],revealMaterial);
  const rearZ=back+thickness/2;
  shellBox([width,.55,thickness],[0,floorY+.275,rearZ]);
  shellBox([width,.47,thickness],[0,floorY+tall-.235,rearZ]);
  for (const [from,to] of [[left,-4.6],[-2.75,-1.15],[1.15,2.75],[4.60,right]]) {
    shellBox([to-from,1.36,thickness],[(from+to)/2,floorY+1.23,rearZ]);
  }
  for (const [from,to] of [[-4.60,-2.75],[-1.15,1.15],[2.75,4.60]]) {
    const mid=(from+to)/2;
    for (const x of [from,mid,to]) {
      shellBox([.045,1.36,.20],[x,floorY+1.23,rearZ],revealMaterial);
    }
    shellBox([to-from,.055,.23],[mid,floorY+.55,rearZ],revealMaterial);
  }
  // World-space buildings and street details give the exterior real parallax.
  const city = new T.Group();
  group.add(city);
  const interior = new T.Group();
  group.add(interior);
  const blockGeometry = new T.BoxGeometry(1,1,1);
  function cityBox(size,position,color,parent=city) {
    const mesh=new T.Mesh(blockGeometry,new T.MeshStandardMaterial({color,roughness:.76}));
    mesh.position.set(...position);
    mesh.scale.set(...size);

  const tukX=7.2;

  cityBox([48,.035,4.4],[0,.012,-8.2],0x263148);
  cityBox([48,.05,1.1],[0,.035,-5.58],0x586074);

  }
  for(let i=0;i<14;i++) {

  }
  // Stepped silhouette inspired by the pixel cuts of MahaNakhon.
  building(8.62,-24,2.5,2.6,8.4,0x3e5378);
  building(8.25,-24,1.78,2.2,10.7,0x43658d);
  building(8.70,-24,1.30,1.85,12.2,0x3b5a82);
  const windows=new T.InstancedMesh(blockGeometry,new T.MeshBasicMaterial({color:0xffffff}),panes.length);
  const transform=new T.Object3D();
  panes.forEach(([x,y,z,color],i)=>{
    transform.position.set(x,y,z);
    transform.scale.set(.22,.29,.022);
    transform.updateMatrix();
    windows.setMatrixAt(i,transform.matrix);
    windows.setColorAt(i,new T.Color(color));
  });
  city.add(windows);
  // Shape the street around the shophouse, BTS and temple silhouettes of the reference.
  {
    const gold = 0xd9a743;
    const cream = 0xefe2ca;
    const vermilion = 0xa74734;
    const darkGreen = 0x295c51;
    function addSculpture(geometry, position, color) {
      const mesh = new T.Mesh(geometry, new T.MeshStandardMaterial({color, roughness:.69}));
      mesh.position.set(...position);
      city.add(mesh);
      return mesh;
    }
    function templeRoof(x, z, base, width, depth, rise, color) {
      const slope = Math.atan2(rise, depth/2);
      const length = Math.hypot(rise, depth/2);
      for (const side of [-1,1]) {
        cityBox([width,.10,length],[x,base+rise/2,z+side*depth/4],color).rotation.x=side*slope;
        cityBox([width+.08,.06,.08],[x,base,z+side*depth/2],gold);
      }
      cityBox([width+.10,.06,.08],[x,base+rise,z],gold);
      for (const side of [-1,1]) {
        const finial=addSculpture(new T.ConeGeometry(.105,.37,5),
          [x+side*(width/2+.02),base+rise+.13,z],gold);
        finial.rotation.z=-side*.32;
      }
    }
    // Layered red and green roofs and a gold chedi sit just behind the tracks.
    const hallX=-6.95;
    const hallZ=-19.55;
    cityBox([4.35,.15,2.92],[hallX,.08,hallZ],cream);
    cityBox([3.62,3.15,2.18],[hallX,1.67,hallZ],cream);
    for (const offset of [-1.43,0,1.43]) {
      cityBox([.16,3.01,.18],[hallX+offset,1.61,hallZ+1.17],gold);
    }
    templeRoof(hallX,hallZ,3.27,4.16,2.72,.84,vermilion);
    templeRoof(hallX,hallZ,3.93,3.67,1.94,.83,darkGreen);
    templeRoof(hallX,hallZ,4.49,2.76,1.20,.75,vermilion);
    const chediX=-8.40;
    const chediZ=-20.73;
    cityBox([1.58,3.63,1.50],[chediX,1.82,chediZ],0xd9cbb1);
    let chediY=3.63;
    for (const [top,bottom,height] of [
      [.73,.86,.24],[.68,.73,.25],[.62,.57,.24],[.57,.62,.20],
      [.48,.58,.45],[.25,.48,.70],[.20,.28,.18],[.11,.20,.32],[.015,.11,.80],
    ]) {
      addSculpture(new T.CylinderGeometry(top,bottom,height,12),

    }
    const details=[];
    const block=(size,position,color,tilt=0)=>details.push({size,position,color,tilt});
    for (let house=0;house<12;house++) {
      const x=(house-5.5)*2.7;

      const shutterColor=[0x43705b,0x35618a,0x476e65][house%3];
      const h=2.5+(house%3)*.34;
      block([.67,.90,.05],[x,.47,-11.224],doorColor);
      block([.69,.12,.07],[x,1.88,-11.224],cream);
      block([.08,.87,.055],[x,.47,-11.190],0x31404c);
      block([.11,.51,.075],[x-.45,1.62,-11.210],shutterColor);
      block([.11,.51,.075],[x+.45,1.62,-11.210],shutterColor);
      block([2.35,.075,.13],[x,h-.10,-11.230],cream);
      for (let stripe=0; stripe<5; stripe++) {
        block([.17,.025,.53],[x-.82+stripe*.365,1.15,-11.027],cream,.18);
      }
    }
    for (let curb=0;curb<48;curb++) {
      block([.55,.09,.12],[-13+curb*.56,.074,-10.43],curb%2?cream:0xb85142);
    }
    // Framed windows and a navy lower stripe make the elevated train more legible.
    for (let car=0;car<3;car++) {
      const x=-5.8+car*2.4;
      block([2.17,.095,.019],[x,4.16,-16.473],0x264d73);
      block([2.05,.085,.85],[x,4.552,-16.9],0x7a8794);
      for (const offset of [-.82,0,.82]) {
        block([.022,.30,.018],[x+offset,4.29,-16.451],cream);
      }
    }
    for (let support=-12;support<15;support+=4) {
      block([.60,.18,.63],[support,3.54,-16.9],0xbcc1c6);
    }
    for (const x of [-10.5,-4.5,1.5,7.5,13.5]) {
      block([.085,1.34,.085],[x,.71,-10.35],0x20484d);
      block([.17,.24,.17],[x,1.46,-10.35],0xf2cf88);
      block([.21,.07,.21],[x,1.61,-10.35],0x20484d);
    }
    const detailBlocks = new T.InstancedMesh(blockGeometry,
      new T.MeshStandardMaterial({color:0xffffff,roughness:.80}),details.length);
    const detailTransform=new T.Object3D();
    details.forEach(({size,position,color,tilt},i)=>{
      detailTransform.position.set(...position);
      detailTransform.scale.set(...size);
      detailTransform.rotation.x=tilt;
      detailTransform.updateMatrix();
      detailBlocks.setMatrixAt(i, detailTransform.matrix);
      detailBlocks.setColorAt(i,new T.Color(color));
    });
    city.add(detailBlocks);
  }
  const leafGeometry=new T.IcosahedronGeometry(.34,1);
  const leafMaterial=new T.MeshStandardMaterial({color:0x356c56,roughness:.94});
  function plant(x,z,indoor) {
    const base=indoor?floorY:.04;
    const parent=indoor?interior:city;
    if(indoor) cityBox([.45,.32,.45],[x,base+.16,z],0xa2a2a8,parent);
    cityBox([.085,.62,.085],[x,base+.42,z],0x4f413b,parent);
    for(const [dx,dy,dz] of [[0,.81,0],[-.17,.67,.07],[.18,.70,-.09]]) {
      const leaf=new T.Mesh(leafGeometry,leafMaterial);
      leaf.position.set(x+dx,base+dy,z+dz);
      parent.add(leaf);
    }
  }
  for(const x of [-7.01,7.01]) {
    plant(x,5.77,true);
    plant(x,-4.48,true);
  }
  for(let x=-16;x<=16;x+=3.2) plant(x,-10.7,false);
  // A shared high table sits in the front zone, clear of the center aisle.
  cityBox([2.1,.075,.86],[4.40,.80,5.54],0xaeccd7,interior);
  for(const x of [3.58,5.22]) cityBox([.09,.68,.58],[x,.43,5.54],0x252c42,interior);
  for(const x of [3.78,5.03]) {
    cityBox([.47,.09,.38],[x,.47,6.18],0x8793ad,interior);
    cityBox([.095,.36,.10],[x,.27,6.18],0x303951,interior);
  }
  // Cyan workbench displays with dark steel and red-metal accents.
  cityBox([2.05,.20,.69],[-4.40,.19,5.60],0x622c32,interior);
  cityBox([1.85,.17,.55],[-4.40,.365,5.60],0x273d51,interior);
  cityBox([1.48,.025,.46],[-4.40,.47,5.60],0x63bad7,interior);
  const cyanGlow=new T.MeshBasicMaterial({color:0x76e8ff});
  for (const r of [.24,.38,.53]) {
    const ring=new T.Mesh(new T.TorusGeometry(r,.012,8,36),cyanGlow);
    ring.rotation.x=-Math.PI/2;
    ring.position.set(-4.40,.78+(r-.24)*.52,5.60);
    interior.add(ring);
  }
  const model=new T.Mesh(new T.OctahedronGeometry(.22),new T.MeshStandardMaterial({
    color:0x53bada,emissive:0x107baa,emissiveIntensity:.55,wireframe:true
  }));
  model.position.set(-4.40,.925,5.60);
  interior.add(model);
  const limbAxis = new T.Vector3(0,1,0);
  const limbDirection = new T.Vector3();
  function connect(mesh,a,b) {
    limbDirection.subVectors(b,a);
    mesh.position.copy(a).lerp(b,.5);
    mesh.scale.y=limbDirection.length();
    mesh.quaternion.setFromUnitVectors(limbAxis,limbDirection.normalize());
  }
  function pose(person,phase,walking=false) {
    const stand = walking ? 0 : person.stand;
    for (let j=0;j<2;j++) {
      const sign=j===0?-1:1;
      const step=Math.sin(phase+j*Math.PI);
      const x=sign*.22;
      const shoulder=new T.Vector3(sign*.34,.99,.08);
      const elbow=new T.Vector3(sign*.31,.76,walking ? .07+step*.17 : .39-stand*.25);
      const hand=new T.Vector3(x,walking ? .56 : .88+step*.027-stand*.19, walking ? .11+step*.30 : .79+step*.035-stand*.60);
      connect(person.upperArms[j],shoulder,elbow);
      connect(person.forearms[j],elbow,hand);
      person.hands[j].position.copy(hand);
      const hip=new T.Vector3(sign*.16,.57,-.04);
      const knee=new T.Vector3(sign*.19,walking ? .35 : .47-stand*.17, walking ? .12-step*.21 : .35-stand*.29);
      const foot=new T.Vector3(sign*.19,walking ? .16+Math.max(0,step)*.08 : .16-stand*.26, walking ? .02-step*.33 : .43-stand*.34);
      connect(person.legs[j],hip,knee);
      connect(person.shins[j],knee,foot);
      person.shoes[j].position.copy(foot);
    }
  }
  avatars.forEach(person=>pose(person,0));
  const initialView={angle:.25,elevation:.43,radius:25.8};
  let {angle,elevation,radius}=initialView;
  let start=null;
  const target=new T.Vector3(-.15,2.95,-3.50);
  function render() {
    const width = view.clientWidth;
    const height = view.clientHeight;
    if (!width || !height) return;
    if (width!==sizes.width || height!==sizes.height) {
      renderer.setSize(width,height,false);
      sizes.width=width;
      sizes.height=height;
    }
    camera.aspect=width/height;
    camera.fov=width/height<1 ? 64 : 49;
    camera.updateProjectionMatrix();
    camera.position.set(target.x+Math.sin(angle)*Math.cos(elevation)*radius,target.y+Math.sin(elevation)*radius,target.z+Math.cos(angle)*Math.cos(elevation)*radius);
    camera.lookAt(target);
    roomEdges.forEach((edge,i)=>edge.material.color.set(i===Number(view.dataset.selected) ? 0xffd148 : 0x65596a));
    renderer.render(scene,camera);
    avatars.forEach(({avatar},i)=>{
      const {caption}=captions[i];
      avatar.getWorldPosition(headPosition);
      headPosition.y+=2.30;
      headPosition.project(camera);
      caption.hidden = headPosition.z>1 || Math.abs(headPosition.x)>.99 || Math.abs(headPosition.y)>.99;
      caption.style.left = ((headPosition.x+1)*width/2)+'px';
      caption.style.top = ((1-headPosition.y)*height/2)+'px';
    });
  }
  const trips = [];
  let walking = false;
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const journey = document.getElementById('office-3d-journey');
  function nextTrip() {
    const trip = trips.shift();
    if (!trip) { walking=false; return; }
    const person=avatars[trip.from];
    const {avatar,room,home} = person;
    const other = avatars[trip.to];
    const origin = room.position.clone().add(home);
    avatar.position.copy(home);
    const destination = other.room.position.clone().add(other.home).add(new T.Vector3(.7,0,.4));
    const sourceExit = new T.Vector3(0,0,origin.z);
    const targetExit = new T.Vector3(0,0,destination.z);
    journey.textContent = trip.label;
    if (reducedMotion.matches) { nextTrip(); return; }
    walking = true;
    avatars[trip.from].inTransit=true;
    const path = new T.CurvePath();
    const points = [origin,sourceExit,targetExit,destination,targetExit,sourceExit,origin];
    for (let i=1;i<points.length;i++) {
      if (points[i].distanceToSquared(points[i-1]) > .001) {
        path.add(new T.LineCurve3(points[i-1],points[i]));
      }
    }
    const startTime = performance.now();
    const duration = Math.max(2150,path.getLength()*310);
    function walk(now) {
      const progress = Math.min((now-startTime)/duration,1);
      const position = path.getPoint(progress);
      const ahead = path.getPoint(Math.min(progress+.004,1));
      const stride = Math.sin((now-startTime)*.018);
      avatar.position.copy(position.sub(room.position));
      avatar.position.y = .05 + Math.abs(stride)*.1;
      avatar.rotation.y = Math.atan2(ahead.x-avatar.position.x-room.position.x,ahead.z-avatar.position.z-room.position.z);
      pose(person,(now-startTime)*.018,true);
      if (progress === 1) {
        avatars[trip.from].inTransit=false;
        avatar.position.copy(home);
        avatar.rotation.y=0;
        pose(person,0);
      }
      render();
      if (progress < 1) requestAnimationFrame(walk);
      else nextTrip();
    }
    requestAnimationFrame(walk);
  }
  view.addEventListener('office-handoff', event => {
    const trip=event.detail;
    if (!avatars[trip.from] || !avatars[trip.to] || trip.from===trip.to) return;
    trips.push(trip);
    if (!walking) nextTrip();
  });
  const ray=new T.Raycaster();
  const vector=new T.Vector2();
  const canvas=renderer.domElement;
  canvas.addEventListener('pointerdown',e=>{
    start={x:e.clientX,y:e.clientY, angle,elevation};
    canvas.setPointerCapture(e.pointerId);
  });
  function chooseHovered(index) {
    hovered=index;
    canvas.style.cursor=index<0?'grab':'pointer';
    if (reducedMotion.matches) {
      avatars.forEach((person,i)=>{
        if (person.inTransit) return;
        person.stand=Number(i===hovered);
        person.avatar.position.y=person.home.y+person.stand*.26;
        pose(person,0);
      });
      render();
    }
  }
  canvas.addEventListener('pointerleave',()=>chooseHovered(-1));
  canvas.addEventListener('pointermove',e=>{
    if (!start) {
      if (e.pointerType==='touch') return;
      const rect=canvas.getBoundingClientRect();
      vector.set((e.clientX-rect.left)/rect.width*2-1,1-(e.clientY-rect.top)/rect.height*2);
      ray.setFromCamera(vector,camera);
      const target=ray.intersectObjects(hoverTargets)[0];
      chooseHovered(target?.object.userData.room ?? -1);
      return;
    }
    chooseHovered(-1);
    angle=start.angle-(e.clientX-start.x)*.009;
    elevation=Math.max(.30,Math.min(1.44,start.elevation+(e.clientY-start.y)*.007));
    render();
  });
  canvas.addEventListener('pointerup',e=>{
    if (!start) return;
    const click=Math.hypot(e.clientX-start.x,e.clientY-start.y)<5;
    start=null;
    if (!click) return;
    const rect=canvas.getBoundingClientRect();
    vector.set((e.clientX-rect.left)/rect.width*2-1,1-(e.clientY-rect.top)/rect.height*2);
    ray.setFromCamera(vector,camera);
    const location=ray.intersectObjects(hit)[0];
    if(location) view.dispatchEvent(new CustomEvent('office-room',{detail:location.object.userData.room}));
  });
  canvas.addEventListener('pointercancel',()=>{start=null;});
  function zoom(change) { radius=Math.max(9,Math.min(42,radius+change)); render(); }
  canvas.addEventListener('wheel',e=>{e.preventDefault();zoom(Math.sign(e.deltaY)*.75);},{passive:false});
  document.getElementById('office-3d-in').onclick=()=>zoom(-1);
  document.getElementById('office-3d-out').onclick=()=>zoom(1);
  document.getElementById('office-3d-reset').onclick=()=>{
    ({angle,elevation,radius}=initialView);
    render();
  };
  new ResizeObserver(render).observe(view);
  let displayedRoles = [];
  function updateLabels() {
    displayedRoles = JSON.parse(view.dataset.roles || '[]');
    displayedRoles.forEach((role,i)=>{
      const {name,status}=captions[i];
      name.textContent=role.name;
      status.textContent=role.activity ? role.status+' · '+role.activity : role.status;
      status.title=role.activity ? role.status+' · '+role.activity : role.status;
    });
    render();
  }
  new MutationObserver(updateLabels).observe(view,{attributes:true,attributeFilter:['data-selected','data-roles']});
  let activityStart;
  renderer.setAnimationLoop(now=>{
    if (reducedMotion.matches) return;
    activityStart ??= now;
    model.rotation.y=now*.00063;
    avatars.forEach((person,i)=>{
      const {avatar,home,inTransit}=person;
      if (inTransit) return;
      const phase=now*.002+i*1.32;
      const working=displayedRoles[i]?.status==='กำลังทำงาน';
      const cycle=((now-activityStart)+i*1520)%10100;
      const patrol=cycle>=5100 && (hovered!==i || person.roaming);
      if (patrol) {
        person.roaming=true;
        const progress=(cycle-5100)/5000;
        const travel=Math.sin(progress*Math.PI);
        const direction=i%2 ? -1 : 1;
        avatar.position.set(home.x+direction*travel*1.06,home.y+.07+Math.abs(Math.sin(phase*7))*.055,home.z-travel*.46);
        avatar.rotation.y=progress<.5 ? direction*1.9 : -direction*1.1;
        hoverTargets[i].position.set(avatar.position.x,1.47+avatar.position.y,avatar.position.z);
        pose(person,phase*7,true);
        return;
      }
      person.roaming=false;
      avatar.position.x=home.x;
      avatar.position.z=home.z;
      hoverTargets[i].position.set(home.x,1.47,home.z);
      person.stand += (Number(i===hovered)-person.stand)*.19;
      const rise=person.stand*.26 + Math.sin(person.stand*Math.PI)*.055;
      avatar.position.y=home.y+rise+Math.sin(phase)*.012;
      avatar.rotation.y=Math.sin(phase*.63)*.035;
      pose(person,phase*(working?5:3));
    });
    render();
  });
  notice.textContent='ลากเพื่อหมุน · ใช้ล้อเมาส์หรือปุ่ม + / − เพื่อซูม';
  updateLabels();
} catch {
  view.hidden = true;
  notice.textContent = 'ฉาก 3D โหลดไม่ได้ · ยังเลือกผู้ช่วยจากการ์ดด้านล่างได้';
  for (const id of ['office-3d-in','office-3d-out','office-3d-reset']) {
    document.getElementById(id).hidden = true;
  }
  view.addEventListener('office-handoff', event => {
    document.getElementById('office-3d-journey').textContent = event.detail.label;
  });
}
</script>
