<!doctype html>
<html lang="th">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Agency Office</title>
<style>
:root{font:16px system-ui,sans-serif;color:#192132;background:#f7f8fc}
*{box-sizing:border-box}
body{margin:0}
header,main{max-width:1440px;margin:auto;padding:24px 30px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:0}
h1,h2,p{margin:0}
h1{font-size:clamp(1.5rem,3vw,2.2rem);letter-spacing:-.05em}
h2{font-size:1.05rem;margin-bottom:12px}
small,.muted{color:#515e73;font-size:.875rem}
main{display:grid;grid-template-columns:2.1fr 1fr;gap:22px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:20px}
.room{border:1px solid #d7deea;border-radius:16px;background:white;overflow:hidden;text-align:left;padding:0;cursor:pointer;color:inherit}
.room[aria-pressed=true]{outline:2px solid #344976;outline-offset:2px}
.avatar{display:grid;place-items:center;height:110px;background:var(--tone);font-size:3.25rem}
.support .avatar{height:76px;font-size:2.4rem}
.room-info{display:grid;gap:6px;padding:12px;font-size:.94rem}
.status{display:flex;align-items:center;gap:7px;font-size:.875rem;color:#45516a}
.status:before{content:"";width:9px;height:9px;border-radius:50%;background:#8c97a9}
.status.running:before{background:#7245d9}
.status.queued:before{background:#c37c00}
.status.done:before{background:#138252}
.status.failed:before{background:#c32947}
aside{display:grid;grid-template-rows:minmax(190px, .75fr) minmax(320px,1.25fr);gap:14px;min-width:0}
.panel{display:flex;flex-direction:column;min-height:0;background:white;border:1px solid #d7deea;border-radius:16px;padding:16px}
.region{overflow:auto;max-height:290px;overflow-wrap:anywhere}
.row{padding:10px 0;border-bottom:1px solid #e8ecf2}
.row p{white-space:pre-wrap}
form{margin-top:auto;padding-top:12px;display:grid;gap:8px}
.compose{display:flex;gap:8px}
input,button{font:inherit}
input{min-width:0;flex:1;border:1px solid #adb9cd;border-radius:9px;padding:9px}
.send{border:0;border-radius:9px;background:#26385e;color:white;padding:8px 15px;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
@media(max-width:850px){main{grid-template-columns:1fr} header,main{padding-inline:16px}aside{grid-template-rows:auto auto}.panel{min-height:180px}}
#office-3d{background:linear-gradient(140deg,#e0e7ff,#fceaf6);border:1px solid #d7deea;border-radius:15px;margin-bottom:14px;color:#202437;overflow:hidden}
#office-3d-stage{height:clamp(300px,42vw,490px);position:relative}
#office-3d-stage canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.office-3d-controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:8px 10px;background:#f9f7ff}
.office-3d-controls small{flex:1;color:#394158}
.office-3d-controls button{min-height:34px;background:#fff;color:#202437;border:1px solid #d0d7ea;border-radius:7px;padding:4px 9px;font:inherit}

#office-3d-stage{height:clamp(330px,48vw,575px);background:radial-gradient(ellipse at 50% 42%,#fbfcff,#e4e9f6)}
.office-avatar-caption{position:absolute;z-index:1;transform:translate(-50%,-100%);pointer-events:none;max-width:clamp(100px,27%,185px);padding:4px 7px;border:1px solid #d7deed;border-radius:8px;color:#18223a;background:#fffffff5;text-align:center;box-shadow:0 2px 9px #1a274323;line-height:1.2}
.office-avatar-caption strong,.office-avatar-caption small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.office-avatar-caption strong{font-size:clamp(10px,1.1vw,13px)}
.office-avatar-caption small{font-size:clamp(10px,1vw,12px);margin-top:2px;color:#494c70}
#agency-sim .rooms{gap:16px}
#agency-sim .room{position:relative}
#agency-sim .room .card-activity{position:absolute;inset:7px auto auto 7px;max-width:calc(100% - 14px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#172032ec;color:#fff;border-radius:6px;padding:4px 7px;font-size:12px}

html{background:#080d1b;color-scheme:dark}
:root{background:#080d1b;color:#edf3ff}.room,.panel{background:#141e32;color:#edf3ff;border-color:#394664}.region,.muted,.status{color:#c7d4ed}.row{border-color:#354461}
body{margin:0;background:#080d1b;color:#edf3ff}
#agency-sim{--paper:#080d1b;--tile:#141e32;--ink:#edf3ff;--line:#394664;background:#080d1b;color:#edf3ff}
#agency-sim article,#agency-sim button,#agency-sim input{color:#edf3ff}
#agency-sim .room{background:#151d32}
#office-3d{background:#0d1528;border-color:#34486e;color:#edf3ff}
#office-3d-stage{background:radial-gradient(ellipse at 50% 42%,#1e2b4d,#0b1021)}
.office-3d-controls{background:#111b31}
.office-3d-controls small{color:#d1dfff}
.office-3d-controls button{background:#202e4b;color:#edf3ff;border-color:#405278}
.office-avatar-caption{background:#141f38f5;color:#f1f6ff;border-color:#425987}
.office-avatar-caption small{color:#bcdbff}
#agency-sim .card-activity::before{content:"";display:inline-block;width:6px;height:6px;margin-right:6px;border-radius:50%;background:#81bfff;animation:office-indicator 2s ease-in-out infinite}
@keyframes office-indicator{50%{opacity:.45}}
@media(prefers-reduced-motion:reduce){#agency-sim .card-activity::before{animation:none}}

.office-skyline{height:clamp(140px,20vw,280px);background:#101d3c url("./bangkok-day.webp") center 46% / cover no-repeat;border-bottom:1px solid #364979}
#office-3d-stage .office-skyline{background-position:center;background-size:cover}
#office-3d-stage{background:linear-gradient(#111d36,#080e1f)}
#office-3d-stage .office-skyline{height:100%;position:absolute;inset:0;opacity:.68;border:0;pointer-events:none}
#office-3d-stage canvas{position:relative}
.office-avatar-caption{box-shadow:0 0 12px #5ca4f02f}
.office-skyline:has(+ #office-3d.office-rendered){display:none}
#office-3d-stage .city-reference{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#0b2441;z-index:2;pointer-events:none}
#office-3d-stage .city-reference[hidden],#office-city-view[hidden]{display:none}
</style>
<header><h1>AI Agency</h1><span id="connection" class="muted" role="status">กำลังเชื่อมต่อ</span></header>
<main>
<section aria-label="ออฟฟิศ">
<section id="office-3d" aria-label="ออฟฟิศสามมิติ">
<div id="office-3d-stage" data-selected="1"><div class="office-skyline" aria-hidden="true"></div></div>
<div class="office-3d-controls">
<small id="office-3d-notice" role="status">กำลังโหลดฉาก 3D</small>
<button id="office-3d-in" type="button" aria-label="ซูมเข้า">+</button>
<button id="office-3d-out" type="button" aria-label="ซูมออก">−</button>
<button id="office-city-view" type="button" hidden>วิวกรุงเทพฯ</button>
<button id="office-3d-reset" type="button">มุมมองรวม</button>
<small id="office-3d-journey" role="status"></small>
</div>
</section>
<h2>ทีมหลัก</h2><div class="grid" id="main-team"></div>
<h2>ทีมเบื้องหลัง</h2><div class="grid support" id="support-team"></div>
<p class="muted">ตัวละครเป็นภาพแทนชั่วคราว · คลิกห้องเพื่อเลือกผู้ช่วย</p>
</section>
<aside>
<section class="panel"><h2>รายการงาน</h2><div class="region" id="tasks"></div></section>
<section class="panel"><h2>แชท</h2><div class="region" id="chat" role="log"></div>
<form id="form"><label id="recipient" for="message"></label><div class="compose"><input id="message" placeholder="พิมพ์โจทย์งาน" maxlength="4000" required><button class="send" type="submit">ส่ง</button></div><label id="handoff-option" hidden><input type="checkbox" id="handoff"> ส่งบรีฟให้ Graphic Designer อัตโนมัติ</label><p id="error" role="alert" class="muted"></p></form></section>
</aside>
</main>
<script>
const roles = [
  ['sales','Sales & Account Executive','🧑‍💼','#e9f4c8'],
  ['content','Content Planner','💡','#fbe1ed'],
  ['graphics','Graphic Designer','🧑‍🎨','#d8f6e9'],
  ['video','Video Editor','🎬','#e9defa'],
  ['seo','SEO Specialist','🕵️','#d9f4f8'],
  ['web','Web Developer','🧑‍💻','#dfe9fd'],
];
const labels = {idle:'ยังไม่มีงาน',queued:'รอทำงาน',running:'กำลังทำงาน',done:'ทำเสร็จแล้ว',failed:'งานไม่สำเร็จ'};
const el = id => document.getElementById(id);
const rooms = new Map();
const names = new Map(roles.map(([id,name]) => [id,name]));
let selected = 'sales';
let jobs = [];
let signature = '';
let firstSnapshot = true;
const seenHandoffs = new Set();
for (const [index,[id,name,character,tone]] of roles.entries()) {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'room';
  button.style.setProperty('--tone',tone);
  button.innerHTML = '<span class="avatar" aria-hidden="true"></span><span class="room-info"><strong></strong><span class="status"></span></span>';
  button.querySelector('.avatar').textContent = character;
  button.querySelector('strong').textContent = name;
  button.onclick = () => {selected=id; render();};
  rooms.set(id,button);
  el(index<4?'main-team':'support-team').append(button);
}
function text(parent,tag,value,className='') {
  const node = document.createElement(tag);
  node.className = className;
  node.textContent = value;
  parent.append(node);
  return node;
}
const stage = el('office-3d-stage');
stage.addEventListener('office-room', event => { selected = roles[event.detail][0]; render(); });
function render() {
  stage.dataset.selected = roles.findIndex(role => role[0] === selected);
  const sceneRoles=[];
  for (const [id,room] of rooms) {
    const assigned = jobs.filter(job => job.role===id);
    const state = assigned.find(job => job.status==='running')?.status
      || assigned.find(job => job.status==='queued')?.status
      || assigned.at(-1)?.status || 'idle';
    room.setAttribute('aria-pressed',String(id===selected));
    const status = room.querySelector('.status');
    status.className = 'status '+state;
    status.textContent = labels[state];
    const active = assigned.find(job=>job.status==='running');
    sceneRoles.push({name:names.get(id),status:labels[state],activity:active?.prompt.slice(0,65) || ''});
  }
  stage.dataset.roles=JSON.stringify(sceneRoles);
  el('handoff-option').hidden = selected !== 'content';
  el('recipient').textContent = 'ส่งถึง '+names.get(selected);
  const tasks=el('tasks');
  const chat=el('chat');
  tasks.replaceChildren();
  chat.replaceChildren();
  if (!jobs.length) text(tasks,'p','ยังไม่มีงาน','muted');
  for (const job of [...jobs].reverse()) {
    const row=text(tasks,'div','','row');
    text(row,'strong',job.prompt);
    if (job.parent_id) text(row,'small','รับบรีฟต่อจาก Content Planner');
    text(row,'div',names.get(job.role)+' · '+labels[job.status],'status '+job.status);
  }
  const thread=jobs.filter(job => job.role===selected);
  if (!thread.length) text(chat,'p','ยังไม่มีข้อความสำหรับผู้ช่วยนี้','muted');
  for (const job of thread) {
    const row=text(chat,'div','','row');
    text(row,'strong','คุณ');
    text(row,'p',job.prompt);
    if(job.answer) {
      text(row,'strong',names.get(job.role));
      text(row,'p',job.answer);
    } else text(row,'small',labels[job.status]);
  }
}
async function refresh() {
  try {
    const response=await fetch('/api/jobs');
    if (!response.ok) throw Error();
    const incoming=await response.json();
    const next=JSON.stringify(incoming);
    el('connection').textContent='เชื่อมต่อคิวงานในเครื่อง';
    if (next!==signature) {
      jobs=incoming;
      signature=next;
      for (const job of jobs) {
        if (!job.parent_id || seenHandoffs.has(job.id)) continue;
        seenHandoffs.add(job.id);
        const parent=jobs.find(item=>item.id===job.parent_id);
        if (!firstSnapshot && parent) {
          stage.dispatchEvent(new CustomEvent('office-handoff',{detail:{
            from:roles.findIndex(role=>role[0]===parent.role),
            to:roles.findIndex(role=>role[0]===job.role),
            label:names.get(parent.role)+' ส่งบรีฟให้ '+names.get(job.role)
          }}));
        }
      }
      firstSnapshot=false;
      render();
    }
  } catch {
    el('connection').textContent='ขาดการเชื่อมต่อ · สถานะล่าสุดอาจเก่า';
  }
}
el('form').addEventListener('submit',async event => {
  event.preventDefault();
  const input=el('message');
  const prompt=input.value.trim();
  if (!prompt) return;
  const send=event.currentTarget.querySelector('button');
  send.disabled=true;
  el('error').textContent='';
  try {
    const response=await fetch('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:selected,prompt,handoff:selected==='content' && el('handoff').checked})});
    if (!response.ok) throw Error((await response.json()).error);
    if (input.value.trim()===prompt) input.value='';
    await refresh();
  } catch(error) {
    el('error').textContent=error.message || 'ส่งงานไม่สำเร็จ';
  } finally {send.disabled=false;}
});
render();
refresh();
setInterval(refresh,1500);
</script>
<script type="module">
const view = document.getElementById('office-3d-stage');
const notice = document.getElementById('office-3d-notice');
try {
  const T = await import('https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js');
  const renderer = new T.WebGLRenderer({antialias:true, alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputColorSpace = T.SRGBColorSpace;
  view.append(renderer.domElement);
  view.querySelector('.office-skyline')?.remove();
  const scene = new T.Scene();
  scene.background = new T.Color(0x8bc6ef);
  scene.fog = new T.FogExp2(0xcbe4f4,.018);
  scene.add(new T.HemisphereLight(0xe6f6ff, 0x9c9eaf, 1.85));
  const lamp = new T.DirectionalLight(0xfff2df, 2.55);
  lamp.position.set(-7, 12, 5);
  scene.add(lamp);
  const camera = new T.PerspectiveCamera(38, 1, .1, 110);
  const colors = [0xa1d52c,0xf84599,0x21ceb3,0x8950ed,0x23b8dc,0x3672ee];
  const hair = [0xffbe56,0xab1458,0xef581e,0x4c22bc,0xe8e9ff,0x20294b];
  const group = new T.Group();
  scene.add(group);
  const hit = [];
  const hoverTargets = [];
  let hovered = -1;
  const roomEdges = [];
  const avatars = [];
  const captions = [];
  const headPosition = new T.Vector3();
  const sizes = {width:0,height:0};
  const bounds = {left:-6.08,right:6.08,back:-5.52,front:5.75};
  const floorY=.091;
  const {left,right,back,front}=bounds;
  const width=right-left;
  const depth=front-back;
  const centerZ=(front+back)/2;
  const floor = new T.Mesh(new T.BoxGeometry(width,.09,depth),new T.MeshStandardMaterial({color:0x364557,roughness:.48,metalness:.22}));
  floor.position.set(0,floorY-.045,centerZ);
  group.add(floor);
  const site = new T.Mesh(new T.PlaneGeometry(92,88),new T.MeshStandardMaterial({color:0x758593,roughness:1}));
  site.rotation.x=-Math.PI/2;
  site.position.set(0,floorY-.095,centerZ);
  group.add(site);
  const geometry = {
    box:new T.BoxGeometry(1,1,1),
    ball:new T.SphereGeometry(.5,24,16),
    capsule:new T.CapsuleGeometry(.25,.5,8,16),
  };
  function part(room, shape, color, size, xyz) {
    const object = new T.Mesh(geometry[shape],new T.MeshStandardMaterial({color,roughness:.62}));
    object.scale.set(...size);
    object.position.set(...xyz);
    object.userData.room = room.userData.room;
    room.add(object);
    hit.push(object);
    return object;
  }
  colors.forEach((color, i) => {
    const room = new T.Group();
    room.userData.room = i;
    room.position.set(i%2 ? 3.35 : -3.35, 0, (Math.floor(i/2)-1)*3.55);
    group.add(room);
    const rug = part(room,'box',color,[3.05,.008,1.83],[0,floorY+.004,.08]);
    rug.material.color.lerp(new T.Color(0x463949),.57);
    part(room,'box',0xd9dfe8,[2.2,.08,.78],[.54,.75,.55]);
    part(room,'box',0x293858,[.12,.59,.55],[-.43,.38,.55]);
    part(room,'box',0x293858,[.12,.59,.55],[1.51,.38,.55]);
    part(room,'box',0xcfd8ea,[.71,.43,.055],[-.47,1.075,1.035]);
    part(room,'box',0x11162d,[.66,.36,.016],[-.47,1.10,1.001]);
    const display=part(room,'box',color,[.59,.29,.012],[-.47,1.10,.990]);
    display.material.emissive.setHex(color);
    display.material.emissiveIntensity=.27;
    const interfacePane=part(room,'box',0x438ada,[.55,.38,.014],[.38,1.12,.88]);
    interfacePane.rotation.y=-.23;
    interfacePane.material.transparent=true;
    interfacePane.material.opacity=.45;
    interfacePane.material.depthWrite=false;
    for(let line=0;line<3;line++){
      const scan=part(room,'box',0x79e7ff,[.32-line*.05,.016,.016],[.35,1.19-line*.067,.89]);
      scan.rotation.y=-.23;
      scan.material.emissive.setHex(0x279fd7);
      scan.material.emissiveIntensity=.65;
    }
    const accent=part(room,'box',0x8a302f,[.28,.08,.55],[1.39,.778,.55]);
    accent.material.metalness=.48;
    part(room,'box',0xb7c6df,[.09,.18,.085],[-.47,.865,1.07]);
    part(room,'box',0xcfd8ea,[.30,.022,.18],[-.47,.805,1.04]);
    const deskProps = [
      [0xd8dfe9,.42,.05,.30], [0xf6d167,.37,.05,.28],
      [0x505972,.60,.064,.36], [0x7360b3,.52,.07,.34],
      [0x47b4c3,.32,.09,.26], [0x526bbe,.48,.07,.29]
    ];
    const [propColor,propWidth,propHeight,propDepth] = deskProps[i];
    part(room,'box',propColor,[propWidth,propHeight,propDepth],[.22,.81,.6]);
    part(room,'box',0xe4e9ef,[1.16,.07,.54],[-.47,.755,.88]);
    const deskLight=part(room,'box',color,[1.14,.016,.025],[-.47,.715,.63]);
    deskLight.material.emissive.setHex(color);
    deskLight.material.emissiveIntensity=.5;
    part(room,'box',0x1b2941,[.26,.012,.16],[-.16,.799,.88]);
    part(room,'box',0x17243b,[.60,.035,.22],[-.47,.81,.81]);
    for (let key=0;key<7;key++) part(room,'box',0x76a9dc,[.057,.012,.047],[-.72+key*.081,.833,.81]);
    part(room,'box',0x272e49,[.65,.12,.57],[-.47,.47,-.39]);
    part(room,'box',0x333f63,[.66,.56,.095],[-.47,.72,-.66]);
    part(room,'box',0x252e49,[.1,.4,.1],[-.47,.23,-.39]);
    const firstAvatarPart = room.children.length;
    const skin = i===1 ? 0xd89470 : 0xffbd91;
    const outfit = [
      {body:0xf39133,sleeve:0xfff5e5,trim:0xffbe60},
      {body:0xf7eef8,sleeve:0xf7eef8,trim:0xee3894},
      {body:0x236e55,sleeve:0x236e55,trim:0x9ce3a7},
      {body:0x8052c7,sleeve:0x8052c7,trim:0xcaacff},
      {body:0x54bdd6,sleeve:0x54bdd6,trim:0xc5f6fe},
      {body:0x6650ae,sleeve:0x6650ae,trim:0xb58cfb}
    ][i];
    part(room,'capsule',outfit.body,[1.13,.7,.93],[-.47,.87,-.12]);
    part(room,'box',outfit.trim,[.28,.11,.048],[-.47,.79,.109]);
    if (i===0) {
      for (const x of [-.63,-.31]) {
        part(room,'box',0xf39133,[.095,.30,.04],[x,1.01,.094]);
        part(room,'ball',0xffe3a6,[.052,.052,.033],[x,.91,.131]);
      }
    } else {
      for (const x of [-.55,-.39]) part(room,'box',outfit.trim,[.022,.18,.035],[x,1.03,.104]);
      part(room,'ball',outfit.body,[.55,.29,.24],[-.47,1.12,-.23]);
    }
    part(room,'ball',skin,[.89,.93,.84],[-.47,1.48,-.09]);
    part(room,'ball',hair[i],[.96,.52,.89],[-.47,1.79,-.13]);
    part(room,'ball',hair[i],[.38,.47,.43],[-.82,1.64,.07]).rotation.z=-.28;
    part(room,'ball',hair[i],[.32,.38,.36],[-.19,1.72,.13]);
    const iris=[0x745033,0x5c294f,0x315c38,0x6349a9,0x2a758c,0x303f7e][i];
    for (const [eye,x] of [-.63,-.32].entries()) {
      part(room,'ball',0xfff7ef,[.143,.154,.044],[x,1.505,.278]);
      part(room,'ball',iris,[.093,.115,.042],[x+.016,1.50,.307]);
      part(room,'ball',0x211a2d,[.051,.080,.025],[x+.021,1.50,.324]);
      part(room,'ball',0xffffff,[.023,.023,.018],[x+.008,1.53,.339]);
      const brow=part(room,'ball',hair[i],[.13,.027,.03],[x,1.621+((i+eye)%2)*.018,.286]);
      brow.rotation.z=eye ? -.14 : .14;
    }
    part(room,'ball',skin,[.096,.075,.064],[-.47,1.442,.325]);
    const smileCurve=new T.QuadraticBezierCurve3(
      new T.Vector3(-.585,1.375,.306),
      new T.Vector3(-.47,1.265,.336),

        avatar.rotation.y=progress<.5 ? direction*1.9 : -direction*1.1;
        hoverTargets[i].position.set(avatar.position.x,1.47+avatar.position.y,avatar.position.z);
        pose(person,phase*7,true);
        return;
      }
      person.roaming=false;
      avatar.position.x=home.x;
      avatar.position.z=home.z;
      hoverTargets[i].position.set(home.x,1.47,home.z);
      person.stand += (Number(i===hovered)-person.stand)*.19;
      const rise=person.stand*.26 + Math.sin(person.stand*Math.PI)*.055;
      avatar.position.y=home.y+rise+Math.sin(phase)*.012;
      avatar.rotation.y=Math.sin(phase*.63)*.035;
      pose(person,phase*(working?5:3));
    });
    render();
  });
  updateLabels();
  view.closest('#office-3d').classList.add('office-rendered');
  notice.textContent='ชี้ที่ตัวละครให้ลุก · ลากเพื่อหมุน · คลิกห้องเพื่อเลือกผู้ช่วย';
  render();
} catch {
  notice.textContent='ฉาก 3D เปิดไม่ได้บนอุปกรณ์นี้ · เลือกผู้ช่วยจากการ์ดด้านล่างได้';
  for(const id of ['office-3d-in','office-3d-out','office-3d-reset']) document.getElementById(id).disabled=true;
}
</script>
</html>
