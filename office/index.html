<!doctype html>
<html lang="th">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Agency Office</title>
<style>
:root{font:16px system-ui,sans-serif;color:#192132;background:#f7f8fc}
*{box-sizing:border-box}
body{margin:0}
header,main{max-width:1440px;margin:auto;padding:24px 30px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:0}
h1,h2,p{margin:0}
h1{font-size:clamp(1.5rem,3vw,2.2rem);letter-spacing:-.05em}
h2{font-size:1.05rem;margin-bottom:12px}
small,.muted{color:#515e73;font-size:.875rem}
main{display:grid;grid-template-columns:2.1fr 1fr;gap:22px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:20px}
.room{border:1px solid #d7deea;border-radius:16px;background:white;overflow:hidden;text-align:left;padding:0;cursor:pointer;color:inherit}
.room[aria-pressed=true]{outline:2px solid #344976;outline-offset:2px}
.avatar{display:grid;place-items:center;height:110px;background:var(--tone);font-size:3.25rem}
.support .avatar{height:76px;font-size:2.4rem}
.room-info{display:grid;gap:6px;padding:12px;font-size:.94rem}
.status{display:flex;align-items:center;gap:7px;font-size:.875rem;color:#45516a}
.status:before{content:"";width:9px;height:9px;border-radius:50%;background:#8c97a9}
.status.running:before{background:#7245d9}
.status.queued:before{background:#c37c00}
.status.done:before{background:#138252}
.status.failed:before{background:#c32947}
aside{display:grid;grid-template-rows:minmax(190px, .75fr) minmax(320px,1.25fr);gap:14px;min-width:0}
.panel{display:flex;flex-direction:column;min-height:0;background:white;border:1px solid #d7deea;border-radius:16px;padding:16px}
.region{overflow:auto;max-height:290px;overflow-wrap:anywhere}
.row{padding:10px 0;border-bottom:1px solid #e8ecf2}
.row p{white-space:pre-wrap}
form{margin-top:auto;padding-top:12px;display:grid;gap:8px}
.compose{display:flex;gap:8px}
input,button{font:inherit}
input{min-width:0;flex:1;border:1px solid #adb9cd;border-radius:9px;padding:9px}
.send{border:0;border-radius:9px;background:#26385e;color:white;padding:8px 15px;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
@media(max-width:850px){main{grid-template-columns:1fr} header,main{padding-inline:16px}aside{grid-template-rows:auto auto}.panel{min-height:180px}}
#office-3d{background:linear-gradient(140deg,#e0e7ff,#fceaf6);border:1px solid #d7deea;border-radius:15px;margin-bottom:14px;color:#202437;overflow:hidden}
#office-3d-stage{height:clamp(300px,42vw,490px);position:relative}
#office-3d-stage canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.office-3d-controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:8px 10px;background:#f9f7ff}
.office-3d-controls small{flex:1;color:#394158}
.office-3d-controls button{min-height:34px;background:#fff;color:#202437;border:1px solid #d0d7ea;border-radius:7px;padding:4px 9px;font:inherit}

#office-3d-stage{height:clamp(330px,48vw,575px);background:radial-gradient(ellipse at 50% 42%,#fbfcff,#e4e9f6)}
.office-avatar-caption{position:absolute;z-index:1;transform:translate(-50%,-100%);pointer-events:none;max-width:clamp(100px,27%,185px);padding:4px 7px;border:1px solid #d7deed;border-radius:8px;color:#18223a;background:#fffffff5;text-align:center;box-shadow:0 2px 9px #1a274323;line-height:1.2}
.office-avatar-caption strong,.office-avatar-caption small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.office-avatar-caption strong{font-size:clamp(10px,1.1vw,13px)}
.office-avatar-caption small{font-size:clamp(10px,1vw,12px);margin-top:2px;color:#494c70}
#agency-sim .rooms{gap:16px}
#agency-sim .room{position:relative}
#agency-sim .room .card-activity{position:absolute;inset:7px auto auto 7px;max-width:calc(100% - 14px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#172032ec;color:#fff;border-radius:6px;padding:4px 7px;font-size:12px}

html{background:#f5f0e7;color-scheme:light}
body{margin:0;background:#f5f0e7;color:#342d26}
:root{background:#f5f0e7;color:#342d26}
.room,.panel{background:#fffcf7;border-color:#dfd3c1;color:#342d26}
.region,.muted,.status{color:#635649}
.row{border-color:#e8ddc9}
.send{background:#795831}
#agency-sim{color-scheme:light;--paper:#f5f0e7;--tile:#fffcf7;--ink:#342d26;--line:#dfd3c1;background:var(--paper);color:var(--ink)}
#agency-sim .room{background:#fffdf9;color:#342d26;border-color:#dfd3c1}
#agency-sim .room[aria-pressed=true]{outline-color:#9a773d}
#agency-sim .room[data-state="กำลังทำงาน"] small{color:#62488a}
#agency-sim .room[data-state="รอทำงาน"] small{color:#75501e}
#agency-sim .room[data-state="เสร็จแล้ว"] small{color:#2d664e}
#agency-sim .room .card-activity{background:#fffcf5f5;color:#432e20}
#office-3d{background:#fbf6ea;border-color:#d5c1a2;color:#342d26}
.office-3d-controls{background:#fdf9ef}
.office-3d-controls small{color:#635649}
.office-3d-controls button{background:#f1e3c9;color:#412e18;border-color:#c9ac7f}
.office-avatar-caption{background:#fffaf0f5;color:#33271c;border-color:#c8a978}
.office-avatar-caption small{color:#675442}
#agency-sim .card-activity::before{content:"";display:inline-block;width:6px;height:6px;margin-right:6px;border-radius:50%;background:#a47a43;animation:office-indicator 2s ease-in-out infinite}
@keyframes office-indicator{50%{opacity:.45}}
@media(prefers-reduced-motion:reduce){#agency-sim .card-activity::before{animation:none}}

main{grid-template-columns:minmax(0,4fr) minmax(250px,1fr);align-items:start}
@media(max-width:800px){main{grid-template-columns:minmax(0,1fr)}}
#office-3d-stage{height:clamp(385px,53vw,775px);background:#8bc6ef}
#office-3d-stage[hidden],.office-3d-controls button[hidden]{display:none}
#office-3d-stage canvas{position:relative}
.office-column{min-width:0}
.office-avatar-caption{box-shadow:0 3px 12px #3b241f26}

.office-avatar-caption{width:106px;max-width:none;box-sizing:border-box;padding:3px 5px;line-height:1.12}
.office-avatar-caption strong{font-size:11px}
.office-avatar-caption small{font-size:10px;margin-top:2px}
@media(max-width:620px){.office-avatar-caption{width:90px}.office-avatar-caption strong{font-size:10px}}

#office-3d{margin-bottom:0}
.team-switcher{grid-column:1/-1;min-width:0}
.team-dock{
  display:grid;grid-template-columns:repeat(6,minmax(108px,1fr));
  gap:9px;max-width:970px;overflow-x:auto;padding:3px 3px 8px;
  scrollbar-width:thin;overscroll-behavior-inline:contain;
}
.team-dock .room{min-width:0;padding:0;gap:0;border-radius:10px}
.team-dock .room strong{font-size:.79rem;line-height:1.24;min-height:2.5em;display:block;overflow-wrap:anywhere}
.team-dock .room small,.team-dock .status{font-size:.72rem;line-height:1.25}
.team-dock .room strong{padding:5px 7px 0}
.team-dock .room small{padding:2px 7px 6px}
.team-dock .avatar{height:42px;font-size:1.45rem}
.team-dock .room-info{gap:3px;padding:5px 7px}
.team-dock .room-info strong{padding:0}
.office-sidebar .command-panel{
  position:relative;min-width:0;overflow:hidden;
  background:
    radial-gradient(ellipse at 98% 0%,rgba(161,211,248,.42),transparent 62%),
    linear-gradient(150deg,rgba(255,255,255,.85),rgba(229,242,251,.53) 65%,rgba(255,250,238,.76));
  border:1px solid #b6ccdb;
  box-shadow:inset 0 1px 0 #fff,0 10px 26px #33587918;
  backdrop-filter:blur(18px) saturate(132%);
}
.office-sidebar .command-form{gap:8px}
.office-sidebar .command-form input:not([type=checkbox]){
  min-width:0;background:#ffffffab;border:1px solid #a9c1d5;color:#253c52;
  box-shadow:inset 0 1px 0 #fff;outline-offset:2px;
}
.office-sidebar .command-form input:not([type=checkbox]):focus-visible{
  outline:2px solid #447b9b;
}
.office-sidebar .command-form button[type=submit]{
  background:linear-gradient(150deg,#315b75,#244356);
  color:#fff;border:1px solid #315b75;box-shadow:inset 0 1px 0 #ffffff33;
  white-space:nowrap;
}
@media(max-width:800px){
  #office-3d-stage{height:clamp(340px,68vw,570px)}
  .team-dock{grid-template-columns:repeat(6,minmax(108px,1fr))}
}
</style>
<header><h1>AI Agency</h1><span id="connection" class="muted" role="status">กำลังเชื่อมต่อ</span></header>
<main>
<section class="office-column" aria-label="ออฟฟิศ">
<section id="office-3d" aria-label="ออฟฟิศสามมิติ">
<div id="office-3d-stage" data-selected="1"></div>
<div class="office-3d-controls">
<small id="office-3d-notice" role="status">กำลังโหลดฉาก 3D</small>
<button id="office-3d-in" type="button" aria-label="ซูมเข้า">+</button>
<button id="office-3d-out" type="button" aria-label="ซูมออก">−</button>
<button id="office-3d-reset" type="button">มุมมองเริ่มต้น</button>
<small id="office-3d-journey" role="status"></small>
</div>
</section>
</section>
<aside class="office-sidebar">
<section class="panel"><h2>รายการงาน</h2><div class="region" id="tasks"></div></section>
<section class="panel command-panel"><h2>แชท</h2><div class="region" id="chat" role="log"></div>
<form id="form" class="command-form"><label id="recipient" for="message"></label><div class="compose"><input id="message" placeholder="พิมพ์โจทย์งาน" maxlength="4000" required><button class="send" type="submit">ส่ง</button></div><label id="handoff-option" hidden><input type="checkbox" id="handoff"> ส่งบรีฟให้ Graphic Designer อัตโนมัติ</label><p id="error" role="alert" class="muted"></p></form></section>
</aside>
<section class="team-switcher" aria-label="ทีมผู้ช่วย">
<div class="team-dock" id="team-dock"></div>
</section>
</main>
<script>
const roles = [
  ['sales','Sales & Account Executive','🧑‍💼','#e9f4c8'],
  ['content','Content Planner','💡','#fbe1ed'],
  ['graphics','Graphic Designer','🧑‍🎨','#d8f6e9'],
  ['video','Video Editor','🎬','#e9defa'],
  ['seo','SEO Specialist','🕵️','#d9f4f8'],
  ['web','Web Developer','🧑‍💻','#dfe9fd'],
];
const labels = {idle:'ยังไม่มีงาน',queued:'รอทำงาน',running:'กำลังทำงาน',done:'ทำเสร็จแล้ว',failed:'งานไม่สำเร็จ'};
const el = id => document.getElementById(id);
const rooms = new Map();
const names = new Map(roles.map(([id,name]) => [id,name]));
let selected = 'sales';
let jobs = [];
let signature = '';
let firstSnapshot = true;
const seenHandoffs = new Set();
for (const [id,name,character,tone] of roles) {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'room';
  button.style.setProperty('--tone',tone);
  button.innerHTML = '<span class="avatar" aria-hidden="true"></span><span class="room-info"><strong></strong><span class="status"></span></span>';
  button.querySelector('.avatar').textContent = character;
  button.querySelector('strong').textContent = name;
  button.onclick = () => {selected=id; render();};
  rooms.set(id,button);
  el('team-dock').append(button);
}
function text(parent,tag,value,className='') {
  const node = document.createElement(tag);
  node.className = className;
  node.textContent = value;
  parent.append(node);
  return node;
}
const stage = el('office-3d-stage');
stage.addEventListener('office-room', event => { selected = roles[event.detail][0]; render(); });
function render() {
  stage.dataset.selected = roles.findIndex(role => role[0] === selected);
  const sceneRoles=[];
  for (const [id,room] of rooms) {
    const assigned = jobs.filter(job => job.role===id);
    const state = assigned.find(job => job.status==='running')?.status
      || assigned.find(job => job.status==='queued')?.status
      || assigned.at(-1)?.status || 'idle';
    room.setAttribute('aria-pressed',String(id===selected));
    const status = room.querySelector('.status');
    status.className = 'status '+state;
    status.textContent = labels[state];
    const active = assigned.find(job=>job.status==='running');
    sceneRoles.push({name:names.get(id),status:labels[state],activity:active?.prompt.slice(0,65) || ''});
  }
  stage.dataset.roles=JSON.stringify(sceneRoles);
  el('handoff-option').hidden = selected !== 'content';
  el('recipient').textContent = 'ส่งถึง '+names.get(selected);
  const tasks=el('tasks');
  const chat=el('chat');
  tasks.replaceChildren();
  chat.replaceChildren();
  if (!jobs.length) text(tasks,'p','ยังไม่มีงาน','muted');
  for (const job of [...jobs].reverse()) {
    const row=text(tasks,'div','','row');
    text(row,'strong',job.prompt);
    if (job.parent_id) text(row,'small','รับบรีฟต่อจาก Content Planner');
    text(row,'div',names.get(job.role)+' · '+labels[job.status],'status '+job.status);
  }
  const thread=jobs.filter(job => job.role===selected);
  if (!thread.length) text(chat,'p','ยังไม่มีข้อความสำหรับผู้ช่วยนี้','muted');
  for (const job of thread) {
    const row=text(chat,'div','','row');
    text(row,'strong','คุณ');
    text(row,'p',job.prompt);
    if(job.answer) {
      text(row,'strong',names.get(job.role));
      text(row,'p',job.answer);
    } else text(row,'small',labels[job.status]);
  }
}
async function refresh() {
  try {
    const response=await fetch('/api/jobs');
    if (!response.ok) throw Error();
    const incoming=await response.json();
    const next=JSON.stringify(incoming);
    el('connection').textContent='เชื่อมต่อคิวงานในเครื่อง';
    if (next!==signature) {
      jobs=incoming;
      signature=next;
      for (const job of jobs) {
        if (!job.parent_id || seenHandoffs.has(job.id)) continue;
        seenHandoffs.add(job.id);
        const parent=jobs.find(item=>item.id===job.parent_id);
        if (!firstSnapshot && parent) {
          stage.dispatchEvent(new CustomEvent('office-handoff',{detail:{
            from:roles.findIndex(role=>role[0]===parent.role),
            to:roles.findIndex(role=>role[0]===job.role),
            label:names.get(parent.role)+' ส่งบรีฟให้ '+names.get(job.role)
          }}));
        }
      }
      firstSnapshot=false;
      render();
    }
  } catch {
    el('connection').textContent='ขาดการเชื่อมต่อ · สถานะล่าสุดอาจเก่า';
  }
}
el('form').addEventListener('submit',async event => {
  event.preventDefault();
  const input=el('message');
  const prompt=input.value.trim();
  if (!prompt) return;
  const send=event.currentTarget.querySelector('button');
  send.disabled=true;
  el('error').textContent='';
  try {
    const response=await fetch('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:selected,prompt,handoff:selected==='content' && el('handoff').checked})});
    if (!response.ok) throw Error((await response.json()).error);
    if (input.value.trim()===prompt) input.value='';
    await refresh();
  } catch(error) {
    el('error').textContent=error.message || 'ส่งงานไม่สำเร็จ';
  } finally {send.disabled=false;}
});
render();
refresh();
setInterval(refresh,1500);
</script>
<script type="module">
const view = document.getElementById('office-3d-stage');
const notice = document.getElementById('office-3d-notice');
try {
  const T = await import('https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js');
  let renderer;
  try {
    renderer = new T.WebGLRenderer({antialias:true, alpha:true});
  } catch {
    const {createSoftwareRenderer} = await import('./software-renderer.mjs');
    renderer = createSoftwareRenderer(T);
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputColorSpace = T.SRGBColorSpace;
  view.append(renderer.domElement);
  const scene = new T.Scene();
  scene.background = new T.Color(0x8bc6ef);
  scene.fog = new T.FogExp2(0xcbe4f4,.018);
  scene.add(new T.HemisphereLight(0xe6f6ff, 0x9c9eaf, 1.85));
  const lamp = new T.DirectionalLight(0xfff2df, 2.55);
  lamp.position.set(-7, 12, 5);
  scene.add(lamp);
  const camera = new T.PerspectiveCamera(38, 1, .1, 110);
  const colors = [0xa1d52c,0xf84599,0x21ceb3,0x8950ed,0x23b8dc,0x3672ee];
  const hair = [0xffbe56,0xab1458,0xef581e,0x4c22bc,0xe8e9ff,0x20294b];
  const group = new T.Group();
  scene.add(group);
  const hit = [];
  const hoverTargets = [];
  let hovered = -1;
  const roomEdges = [];
  const avatars = [];
  const captions = [];
  const headPosition = new T.Vector3();
  const sizes = {width:0,height:0};
  const bounds = {left:-7.7,right:7.7,back:-5.52,front:7.15};
  const floorY=.091;
  const {left,right,back,front}=bounds;
  const width=right-left;
  const depth=front-back;
  const centerZ=(front+back)/2;
  const floor = new T.Mesh(new T.BoxGeometry(width,.09,depth),new T.MeshStandardMaterial({color:0xd7c9b5,roughness:.37,metalness:.06}));
  floor.position.set(0,floorY-.045,centerZ);
  group.add(floor);
  const site = new T.Mesh(new T.PlaneGeometry(92,88),new T.MeshStandardMaterial({color:0x758593,roughness:1}));
  site.rotation.x=-Math.PI/2;
  site.position.set(0,floorY-.095,centerZ);
  group.add(site);
  const geometry = {
    box:new T.BoxGeometry(1,1,1),
    ball:new T.SphereGeometry(.5,24,16),
    capsule:new T.CapsuleGeometry(.25,.5,8,16),
  };
  function part(room, shape, color, size, xyz) {
    const object = new T.Mesh(geometry[shape],new T.MeshStandardMaterial({color,roughness:.62}));
    object.scale.set(...size);
    object.position.set(...xyz);
    object.userData.room = room.userData.room;
    room.add(object);
    hit.push(object);
    return object;
  }
  const shadowShape = new T.CircleGeometry(1,24);
  const shadowLayers = [[1,.065],[.80,.075],[.59,.09]].map(([scale,opacity])=>({
    scale,material:new T.MeshBasicMaterial({color:0x745b40,transparent:true,opacity,depthWrite:false})
  }));
  function contactShadow(parent,x,z,radiusX,radiusZ) {
    shadowLayers.forEach(({scale,material},i)=>{
      const shadow=new T.Mesh(shadowShape,material);
      shadow.rotation.x=-Math.PI/2;
      shadow.scale.set(radiusX*scale,radiusZ*scale,1);
      shadow.position.set(x,floorY+.009+i*.0003,z);
      shadow.userData.paintDepth=880-i;
      shadow.renderOrder=i;
      parent.add(shadow);
    });
  }
  colors.forEach((color, i) => {
    const room = new T.Group();
    room.userData.room = i;
    room.position.set(i%2 ? 4.12 : -4.12, 0, (Math.floor(i/2)-1)*3.67);
    group.add(room);
    const rug = part(room,'box',color,[3.5,.008,2.05],[0,floorY+.004,.08]);
    rug.material.color.lerp(new T.Color(0xd4baa0),.88);
    rug.userData.paintDepth=890;
    contactShadow(room,.38,.62,1.46,.55);
    contactShadow(room,-.47,-.40,.48,.39);
    const deskTop=part(room,'box',0xf7f3e7,[2.2,.08,.78],[.54,.75,.55]);
    deskTop.material.roughness=.31;
    part(room,'box',0xc8aa7a,[2.2,.019,.021],[.54,.719,.94]);
    part(room,'box',0xc1a071,[.12,.59,.55],[-.43,.38,.55]);
    part(room,'box',0xc1a071,[.12,.59,.55],[1.51,.38,.55]);
    part(room,'box',0xe7ddd1,[.71,.43,.055],[-.47,1.075,1.035]);
    part(room,'box',0x11162d,[.66,.36,.016],[-.47,1.10,1.001]);
    const display=part(room,'box',color,[.59,.29,.012],[-.47,1.10,.990]);
    display.material.emissive.setHex(color);
    display.material.emissiveIntensity=.27;
    const interfacePane=part(room,'box',0x438ada,[.55,.38,.014],[.38,1.12,.88]);
    interfacePane.rotation.y=-.23;
    interfacePane.material.transparent=true;
    interfacePane.material.opacity=.45;
    interfacePane.material.depthWrite=false;
    for(let line=0;line<3;line++){
      const scan=part(room,'box',0x79e7ff,[.32-line*.05,.016,.016],[.35,1.19-line*.067,.89]);
      scan.rotation.y=-.23;
      scan.material.emissive.setHex(0x279fd7);
      scan.material.emissiveIntensity=.65;
    }
    const accent=part(room,'box',0xc3a172,[.28,.08,.55],[1.39,.778,.55]);
    accent.material.metalness=.48;
    part(room,'box',0xb7c6df,[.09,.18,.085],[-.47,.865,1.07]);
    part(room,'box',0xcfd8ea,[.30,.022,.18],[-.47,.805,1.04]);
    const deskProps = [
      [0xd8dfe9,.42,.05,.30], [0xf6d167,.37,.05,.28],
      [0x505972,.60,.064,.36], [0x7360b3,.52,.07,.34],
      [0x47b4c3,.32,.09,.26], [0x526bbe,.48,.07,.29]
    ];
    const [propColor,propWidth,propHeight,propDepth] = deskProps[i];
    part(room,'box',propColor,[propWidth,propHeight,propDepth],[.22,.81,.6]);
    part(room,'box',0xfffcf3,[1.16,.07,.54],[-.47,.755,.88]);

      connect(person.forearms[j],elbow,hand);
      person.hands[j].position.copy(hand);
      const hip=new T.Vector3(sign*.16,.57,-.04);
      const knee=new T.Vector3(sign*.19,walking ? .35 : .47-stand*.17, walking ? .12-step*.21 : .35-stand*.29);
      const foot=new T.Vector3(sign*.19,walking ? .16+Math.max(0,step)*.08 : .16-stand*.26, walking ? .02-step*.33 : .43-stand*.34);
      connect(person.legs[j],hip,knee);
      connect(person.shins[j],knee,foot);
      person.shoes[j].position.copy(foot);
    }
  }
  avatars.forEach(person=>pose(person,0));
  const initialView={angle:.25,elevation:.43,radius:25.8};
  let {angle,elevation,radius}=initialView;
  let start=null;
  const target=new T.Vector3(-.15,2.95,-3.50);
  function render() {
    const width = view.clientWidth;
    const height = view.clientHeight;
    if (!width || !height) return;
    if (width!==sizes.width || height!==sizes.height) {
      renderer.setSize(width,height,false);
      sizes.width=width;
      sizes.height=height;
    }
    camera.aspect=width/height;
    camera.fov=width/height<1 ? 64 : 49;
    camera.updateProjectionMatrix();
    camera.position.set(target.x+Math.sin(angle)*Math.cos(elevation)*radius,target.y+Math.sin(elevation)*radius,target.z+Math.cos(angle)*Math.cos(elevation)*radius);
    camera.lookAt(target);
    roomEdges.forEach((edge,i)=>edge.material.color.set(i===Number(view.dataset.selected) ? 0xaa7940 : 0xc6b598));
    renderer.render(scene,camera);
    const labels=[];
    avatars.forEach(({avatar},i)=>{
      const {caption}=captions[i];
      avatar.getWorldPosition(headPosition);
      headPosition.y+=2.38;
      headPosition.project(camera);
      caption.hidden = headPosition.z>1 || Math.abs(headPosition.x)>.96 || Math.abs(headPosition.y)>.96;
      if (!caption.hidden) labels.push({caption,x:(headPosition.x+1)*width/2,y:(1-headPosition.y)*height/2});
    });
    const labelWidth=106;
    const gap=37;
    const placed=[];
    // Place the closest labels first, lifting any label that would cover another.
    labels.sort((a,b)=>b.y-a.y).forEach(({caption,x,y})=>{
      x=Math.min(width-labelWidth/2-3,Math.max(labelWidth/2+3,x));
      for(const other of placed) {
        if(Math.abs(x-other.x)<labelWidth+4 && Math.abs(y-other.y)<gap) y=other.y-gap;
      }
      if(y<gap) {
        caption.hidden=true;
        return;
      }
      caption.style.left=x+'px';
      caption.style.top=y+'px';
      placed.push({x,y});
    });
  }
  const trips = [];
  let walking = false;
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const journey = document.getElementById('office-3d-journey');
  function nextTrip() {
    const trip = trips.shift();
    if (!trip) { walking=false; return; }
    const person=avatars[trip.from];
    const {avatar,room,home} = person;
    const other = avatars[trip.to];
    const origin = room.position.clone().add(home);
    avatar.position.copy(home);
    const destination = other.room.position.clone().add(other.home).add(new T.Vector3(.7,0,.4));
    const sourceExit = new T.Vector3(0,0,origin.z);
    const targetExit = new T.Vector3(0,0,destination.z);
    journey.textContent = trip.label;
    if (reducedMotion.matches) { nextTrip(); return; }
    walking = true;
    avatars[trip.from].inTransit=true;
    const path = new T.CurvePath();
    const points = [origin,sourceExit,targetExit,destination,targetExit,sourceExit,origin];
    for (let i=1;i<points.length;i++) {
      if (points[i].distanceToSquared(points[i-1]) > .001) {
        path.add(new T.LineCurve3(points[i-1],points[i]));
      }
    }
    const startTime = performance.now();
    const duration = Math.max(2150,path.getLength()*310);
    function walk(now) {
      const progress = Math.min((now-startTime)/duration,1);
      const position = path.getPoint(progress);
      const ahead = path.getPoint(Math.min(progress+.004,1));
      const stride = Math.sin((now-startTime)*.018);
      avatar.position.copy(position.sub(room.position));
      avatar.position.y = .05 + Math.abs(stride)*.1;
      avatar.rotation.y = Math.atan2(ahead.x-avatar.position.x-room.position.x,ahead.z-avatar.position.z-room.position.z);
      pose(person,(now-startTime)*.018,true);
      if (progress === 1) {
        avatars[trip.from].inTransit=false;
        avatar.position.copy(home);
        avatar.rotation.y=0;
        pose(person,0);
      }
      render();
      if (progress < 1) requestAnimationFrame(walk);
      else nextTrip();
    }
    requestAnimationFrame(walk);
  }
  view.addEventListener('office-handoff', event => {
    const trip=event.detail;
    if (!avatars[trip.from] || !avatars[trip.to] || trip.from===trip.to) return;
    trips.push(trip);
    if (!walking) nextTrip();
  });
  const ray=new T.Raycaster();
  const vector=new T.Vector2();
  const canvas=renderer.domElement;
  canvas.addEventListener('pointerdown',e=>{
    start={x:e.clientX,y:e.clientY, angle,elevation};
    canvas.setPointerCapture(e.pointerId);
  });
  function chooseHovered(index) {
    hovered=index;
    canvas.style.cursor=index<0?'grab':'pointer';
    if (reducedMotion.matches) {
      avatars.forEach((person,i)=>{
        if (person.inTransit) return;
        person.stand=Number(i===hovered);
        person.avatar.position.y=person.home.y+person.stand*.26;
        pose(person,0);
      });
      render();
    }
  }
  canvas.addEventListener('pointerleave',()=>chooseHovered(-1));
  canvas.addEventListener('pointermove',e=>{
    if (!start) {
      if (e.pointerType==='touch') return;
      const rect=canvas.getBoundingClientRect();
      vector.set((e.clientX-rect.left)/rect.width*2-1,1-(e.clientY-rect.top)/rect.height*2);
      ray.setFromCamera(vector,camera);
      const target=ray.intersectObjects(hoverTargets)[0];
      chooseHovered(target?.object.userData.room ?? -1);
      return;
    }
    chooseHovered(-1);
    angle=start.angle-(e.clientX-start.x)*.009;
    elevation=Math.max(.30,Math.min(1.44,start.elevation+(e.clientY-start.y)*.007));
    render();
  });
  canvas.addEventListener('pointerup',e=>{
    if (!start) return;
    const click=Math.hypot(e.clientX-start.x,e.clientY-start.y)<5;
    start=null;
    if (!click) return;
    const rect=canvas.getBoundingClientRect();
    vector.set((e.clientX-rect.left)/rect.width*2-1,1-(e.clientY-rect.top)/rect.height*2);
    ray.setFromCamera(vector,camera);
    const location=ray.intersectObjects(hit)[0];
    if(location) view.dispatchEvent(new CustomEvent('office-room',{detail:location.object.userData.room}));
  });
  canvas.addEventListener('pointercancel',()=>{start=null;});
  function zoom(change) { radius=Math.max(9,Math.min(42,radius+change)); render(); }
  canvas.addEventListener('wheel',e=>{e.preventDefault();zoom(Math.sign(e.deltaY)*.75);},{passive:false});
  document.getElementById('office-3d-in').onclick=()=>zoom(-1);
  document.getElementById('office-3d-out').onclick=()=>zoom(1);
  document.getElementById('office-3d-reset').onclick=()=>{
    ({angle,elevation,radius}=initialView);
    render();
  };
  new ResizeObserver(render).observe(view);
  let displayedRoles = [];
  const shortRoleNames = ['ฝ่ายขาย','คอนเทนต์','กราฟิก','ตัดต่อวิดีโอ','SEO','พัฒนาเว็บ'];
  function updateLabels() {
    displayedRoles = JSON.parse(view.dataset.roles || '[]');
    displayedRoles.forEach((role,i)=>{
      const {name,status}=captions[i];
      name.textContent=shortRoleNames[i];
      name.title=role.name;
      status.textContent=role.status;
      status.title=role.activity ? role.status+' · '+role.activity : role.status;
    });
    render();
  }
  new MutationObserver(updateLabels).observe(view,{attributes:true,attributeFilter:['data-selected','data-roles']});
  let activityStart;
  renderer.setAnimationLoop(now=>{
    if (reducedMotion.matches) return;
    activityStart ??= now;
    model.rotation.y=now*.00063;
    avatars.forEach((person,i)=>{
      const {avatar,home,inTransit}=person;
      if (inTransit) return;
      const phase=now*.002+i*1.32;
      const working=displayedRoles[i]?.status==='กำลังทำงาน';
      const cycle=((now-activityStart)+i*1520)%10100;
      const patrol=cycle>=5100 && (hovered!==i || person.roaming);
      if (patrol) {
        person.roaming=true;
        const progress=(cycle-5100)/5000;
        const travel=Math.sin(progress*Math.PI);
        const direction=i%2 ? -1 : 1;
        avatar.position.set(home.x+direction*travel*1.06,home.y+.07+Math.abs(Math.sin(phase*7))*.055,home.z-travel*.46);
        avatar.rotation.y=progress<.5 ? direction*1.9 : -direction*1.1;
        hoverTargets[i].position.set(avatar.position.x,1.47+avatar.position.y,avatar.position.z);
        pose(person,phase*7,true);
        return;
      }
      person.roaming=false;
      avatar.position.x=home.x;
      avatar.position.z=home.z;
      hoverTargets[i].position.set(home.x,1.47,home.z);
      person.stand += (Number(i===hovered)-person.stand)*.19;
      const rise=person.stand*.26 + Math.sin(person.stand*Math.PI)*.055;
      avatar.position.y=home.y+rise+Math.sin(phase)*.012;
      avatar.rotation.y=Math.sin(phase*.63)*.035;
      pose(person,phase*(working?5:3));
    });
    render();
  });
  notice.textContent='ลากเพื่อหมุน · ใช้ล้อเมาส์หรือปุ่ม + / − เพื่อซูม';
  updateLabels();
} catch {
  view.hidden = true;
  notice.textContent = 'ฉาก 3D โหลดไม่ได้ · ยังเลือกผู้ช่วยจากการ์ดด้านล่างได้';
  for (const id of ['office-3d-in','office-3d-out','office-3d-reset']) {
    document.getElementById(id).hidden = true;
  }
}
</script>
</html>
